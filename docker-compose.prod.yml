# docker-compose.prod.yml
services:
  app:
    build:
      context: .
      args:
        INSTALL_DEV: "false"  # ← dev-пакеты ВЫКЛЮЧЕНЫ
    # ⚠️ НЕТ volumes! Код уже внутри образа
    depends_on:
      - db
      - redis
    networks:
      - laravel
    restart: unless-stopped

  reverb:
    build:
      context: .
      args:
        INSTALL_DEV: "false"
    command: php artisan reverb:start --host=0.0.0.0 --port=6001
    # ⚠️ НЕТ volumes!
    ports:
      - "6001:6001"
    depends_on:
      - db
      - redis
    networks:
      - laravel
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"  # если SSL
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      # Статику можно смонтировать отдельно, если нужно
      # - ./src/public:/var/www/public:ro
    depends_on:
      - app
    networks:
      - laravel
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # ⚠️ НЕТ ports! БД не должна торчать наружу
    networks:
      - laravel
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    networks:
      - laravel
    restart: unless-stopped

networks:
  laravel:
    driver: bridge

volumes:
  pgdata:
  redisdata: